[project]
name = "llm-doc-extractor"
version = "0.1.0"
description = "Document extraction QC pipeline: extract, validate, score confidence, route to human review, and evaluate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "faker>=30.0",
    "huggingface-hub>=0.25",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2.2",
    "pillow>=10.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.9",
    "reportlab>=4.2",
    "rich>=13.7",
    "streamlit>=1.50",
    "typer>=0.13",
]

[project.scripts]
docex = "docex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docex"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
